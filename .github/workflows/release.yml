name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    if: github.repository == 'vrspi/vrspi-runtime'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: vrspi-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: vrspi-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: vrspi-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: vrspi-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: vrspi-windows-x86_64.zip
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/vrspi ${{ matrix.name }}

      - name: Package artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "vrspi-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\vrspi.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}
          # The staged executable is vrspi.exe, which is also what the installer
          # looks for; upstream checked a herdr.exe this fork does not build, so
          # this step used to fail and take the release with it.
          $version = (& (Join-Path $stage "vrspi.exe") --version | Out-String).Trim()
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch [regex]::Escape($tagVersion) -or $version -match "preview") {
            throw "Packaged Windows binary has unexpected version identity: $version"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  validate-release-inputs:
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate release inputs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The tag is the only thing a user sees; a binary reporting a
          # different version than the tag it was published under is the
          # confusing failure this prevents.
          CARGO_VERSION=$(python3 -c 'import re, pathlib; print(re.search(r"^version = \"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(), re.M).group(1))')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          # Release notes come from the changelog, so an empty or missing
          # section must fail here rather than publish a release with no notes.
          python3 scripts/changelog.py extract --version "$VERSION" --output /dev/null
          # Apache-2.0 requires both to travel with the distribution.
          test -f LICENSE
          test -f NOTICE
          echo "v$VERSION is ready to publish"

  release:
    needs: [build, validate-release-inputs]
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Extract release notes from changelog
        run: python3 scripts/changelog.py extract --version "${GITHUB_REF_NAME#v}" --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            vrspi-linux-x86_64/vrspi-linux-x86_64
            vrspi-linux-aarch64/vrspi-linux-aarch64
            vrspi-macos-x86_64/vrspi-macos-x86_64
            vrspi-macos-aarch64/vrspi-macos-aarch64
            vrspi-windows-x86_64.zip/vrspi-windows-x86_64.zip
          body_path: RELEASE_NOTES.md

  # Publishes the release on vrspi.com, where `vrspi update` and both
  # installers read it, so the source repository can be private.
  #
  # Built from the build artifacts rather than the GitHub release, so it does
  # not depend on the repository being public. The deploy key is pinned on the
  # server to `rrsync -wo -no-del` inside the runtime directory: it can add and
  # replace files there and nothing else.
  publish-manifest:
    needs: [build, validate-release-inputs]
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEPLOY_HOST: 194.163.130.197
      DEPLOY_USER: kheiro
      PUBLIC_BASE: https://vrspi.com/runtime

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Stage the release and build the manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SITE="$RUNNER_TEMP/site"
          RELEASE_DIR="$SITE/releases/v$VERSION"
          mkdir -p "$RELEASE_DIR"
          # Each artifact is a directory named after the one file it holds.
          for dir in "$RUNNER_TEMP"/artifacts/*/; do
            cp "$dir"* "$RELEASE_DIR/"
          done
          python3 scripts/changelog.py extract --version "$VERSION" --output "$RUNNER_TEMP/notes.md"
          python3 scripts/build_release_manifest.py \
            --version "$VERSION" \
            --assets "$RELEASE_DIR" \
            --base-url "$PUBLIC_BASE/releases" \
            --notes "$RUNNER_TEMP/notes.md" \
            --output "$SITE/latest.json"
          cp website/install.sh website/install.ps1 "$SITE/"
          cp website/landing.html "$SITE/index.html"
          ls -lR "$SITE"

      - name: Upload to vrspi.com
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VRSPI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VRSPI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # Binaries first, manifest last: a client must never read a
          # manifest that names a file which has not finished uploading.
          # rsync renames each file into place, so a reader sees either the
          # old manifest or the new one, never a partial write.
          rsync -rt --chmod=D755,F644 -e "$SSH" "$SITE/releases/" "$DEPLOY_USER@$DEPLOY_HOST:releases/"
          rsync -t --chmod=F644 -e "$SSH" \
            "$SITE/install.sh" "$SITE/install.ps1" "$SITE/index.html" \
            "$DEPLOY_USER@$DEPLOY_HOST:./"
          rsync -t --chmod=F644 -e "$SSH" "$SITE/latest.json" "$DEPLOY_USER@$DEPLOY_HOST:./"
          rm -f ~/.ssh/deploy_key

      - name: Verify what vrspi.com now serves
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL "$PUBLIC_BASE/latest.json?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/served.json"
          python3 - "$RUNNER_TEMP/served.json" "$VERSION" <<'PY'
          import hashlib, json, sys, urllib.request
          manifest = json.load(open(sys.argv[1]))
          assert manifest["version"] == sys.argv[2], f"served {manifest['version']}, expected {sys.argv[2]}"
          for key, url in manifest["assets"].items():
              data = urllib.request.urlopen(url).read()
              digest = hashlib.sha256(data).hexdigest()
              assert digest == manifest["sha256"][key], f"{key}: served digest {digest} does not match the manifest"
              print(f"{key}: {len(data)} bytes, digest ok")
          PY

      # Clients up to 0.9.4 read the manifest from GitHub Pages. Publishing the
      # same manifest there moves them to a build that reads vrspi.com. Pages
      # stops serving once the repository is private, after which this only
      # updates an unserved branch.
      - name: Publish the same manifest on GitHub Pages
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-build
          git rm -rq --cached .
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cp "$SITE/latest.json" "$SITE/install.sh" "$SITE/install.ps1" "$SITE/index.html" .
          chmod +x install.sh
          touch .nojekyll
          git add -A latest.json install.sh install.ps1 index.html .nojekyll
          git commit -qm "release: publish manifest for ${GITHUB_REF_NAME}"
          git push -f origin HEAD:gh-pages
