name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    if: github.repository == 'vrspi/vrspi-runtime'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: vrspi-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: vrspi-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: vrspi-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: vrspi-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/vrspi ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  validate-release-inputs:
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate release inputs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The tag is the only thing a user sees; a binary reporting a
          # different version than the tag it was published under is the
          # confusing failure this prevents.
          CARGO_VERSION=$(python3 -c 'import re, pathlib; print(re.search(r"^version = \"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(), re.M).group(1))')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          # Release notes come from the changelog, so an empty or missing
          # section must fail here rather than publish a release with no notes.
          python3 scripts/changelog.py extract --version "$VERSION" --output /dev/null
          # Apache-2.0 requires both to travel with the distribution.
          test -f LICENSE
          test -f NOTICE
          echo "v$VERSION is ready to publish"

  release:
    needs: [build, validate-release-inputs]
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Extract release notes from changelog
        run: python3 scripts/changelog.py extract --version "${GITHUB_REF_NAME#v}" --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            vrspi-linux-x86_64/vrspi-linux-x86_64
            vrspi-linux-aarch64/vrspi-linux-aarch64
            vrspi-macos-x86_64/vrspi-macos-x86_64
            vrspi-macos-aarch64/vrspi-macos-aarch64
          body_path: RELEASE_NOTES.md

  # Publishes the manifest that `vrspi update` and install.sh both read.
  #
  # Deliberately small: everything is derived from the release that was just
  # created, so there is no second source of truth to drift. Upstream's
  # equivalent job also published versioned docs and a Cloudflare site, which
  # this fork does not have.
  publish-manifest:
    needs: release
    if: github.repository == 'vrspi/vrspi-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build the manifest from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WORK="$RUNNER_TEMP/manifest"
          mkdir -p "$WORK/assets"
          gh release download "$GITHUB_REF_NAME" --dir "$WORK/assets" --clobber
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$WORK/notes.md"
          python3 scripts/build_release_manifest.py \
            --version "$VERSION" \
            --assets "$WORK/assets" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$WORK/notes.md" \
            --output "$WORK/latest.json"

      - name: Publish the manifest and installer
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/manifest"
          cp website/install.sh "$WORK/install.sh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch holding only what is served, so the published site
          # cannot drift with the source tree.
          git checkout --orphan gh-pages-build
          git rm -rq --cached .
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cp "$WORK/latest.json" latest.json
          cp "$WORK/install.sh" install.sh
          chmod +x install.sh
          touch .nojekyll
          git add -A latest.json install.sh .nojekyll
          git commit -qm "release: publish manifest for ${GITHUB_REF_NAME}"
          git push -f origin HEAD:gh-pages
